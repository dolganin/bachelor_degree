<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ server_name }} Training Stream</title>
    <link rel="icon" href="/static/resources/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <style>

    .hover-little-thing {
        transition: width 0.5s;
        width: 5vw;
        max-width: 200px;
        position: fixed;
        top: 0;
        left: 0;
        /* align-items: center; */
        /* height: 100vh; */
        /* text-align: center; */
        text-shadow: 2px 2px 5px black;
        /* border-bottom: 5px; */
        /* border-right: 5px; */
        border: 5px solid #ff47478c;
        border-left: 0px;
        border-radius: 0px 10px 10px 0px;
        padding: 20px 10px;
        background-color: rgba(0, 0, 0, 0.6);
        display: flex;
        /* flex-wrap: revert-layer; */
        align-content: center;
        /* justify-content: center; */
        height: -webkit-fill-available;
        align-items: center;
    }

    ul {
        padding-left: 1vw;
        /* display: flex; *//* flex-wrap: nowrap; *//* align-content: flex-start; */
    }

    .hover-little-thing:hover {
        /* content-visibility: visible; */
        /* content-visibility: visible; */
        content-visibility: visible;
        max-width: 200px;
        width: 15vw;
        
        .urls { 
            pointer-events: all;
            visibility: visible;
            opacity: 1;
        }
        /* content-visibility: visible; */
    }


    .urls {
        pointer-events: none;
        position: fixed;
        left: 0;
        opacity: 0;
        transition: 
            visibility 1s, opacity 0.3s;
        top: 0;
        margin-top: 5vh;
    }

    li {
        text-align: center;
        font-size: 2em;
        list-style-type: none;
        padding: inherit;
        margin: inherit;
        text-align: center;
        display: flex;
        /* justify-content: center; */
    }

    a {
        color: #ffffff;
        text-decoration: none;
        /* visibility: hidden; */
        text-align: center;
    }

    a:hover {
        color:#ff47478c; 
        text-decoration:none; 
        cursor:pointer;  
    }

        body {
            background-image: url('/static/resources/tallas2_background.jpg'); /* Фон для Tallas2 */
            background-size:cover;
            background-position: center;
            color: white; /* Цвет текста для контраста */
            margin: 0; /* Убираем отступы */
            padding: 10px; /* Убираем отступы */
            display: flex;
            flex-direction: column;
            align-items: center; /* Центрируем элементы */
            scrollbar-width: auto;
            overflow-y: auto;
            height: fit-content;

        }
        .stats-container {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
            position: fixed;
        }
        .stats {
            margin: 5px;
            font-size: 1.2em; /* Увеличиваем размер шрифта статистики */
        }
        #stream {
            width: 80vw; /* 80% от ширины экрана */
            height: 60vh; /* Высота по пропорциям */
            max-width: 1280px; /* Максимальная ширина */
            max-height: 720px; /* Максимальная высота */
            border: 5px solid #ffcc00; /* Цвет рамки */
            border-radius: 10px; /* Скругление углов рамки */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); /* Тень для рамки */
            justify-content: center;
            display: block; /* Центрирование изображения */
            margin: 20px auto; /* Центрирование изображения */
        }
        #best-video {
            width: 80vw; /* 80% от ширины экрана */
            max-width: 1280px; /* Максимальная ширина */
            max-height: 720px; /* Максимальная высота */
            border: 5px solid #00ccff; /* Цвет рамки */
            border-radius: 10px; /* Скругление углов рамки */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); /* Тень для рамки */
            justify-content: center;
            display: block; /* Центрирование видео */
            margin: 20px auto; /* Отступ между потоками */
        }
        .logs-button {
            display: block;
            text-align: center;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #ffcc00; /* Цвет кнопки */
            color: black; /* Цвет текста кнопки */
            text-decoration: none;
            border-radius: 5px; /* Скругление углов кнопки */
            font-size: 1.2em; /* Размер шрифта кнопки */
        }
        .logs-button:hover {
            background-color: #e6b800; /* Цвет кнопки при наведении */
        }

        /* Медиазапросы для мобильных устройств */
        @media (max-width: 600px) {
            h1 {
                font-size: 2em; /* Уменьшаем размер заголовка для маленьких экранов */
            }
            .stats {
                font-size: 1em; /* Уменьшаем размер шрифта статистики */
            }
            .logs-button {
                font-size: 1em; /* Уменьшаем размер шрифта кнопки */
                padding: 8px 16px; /* Уменьшаем отступы кнопки */
            }
        }
    </style>
</head>
<body>
    
    <div class="stats-container">
        <div class="mode" id="mode">Mode: N/A</div>
        <div class="stats" id="epoch">Epoch: N/A</div>
        <div class="stats" id="loss">Loss: N/A</div>
        <div class="stats" id="meanReward">Mean Reward: N/A</div>
    </div>
<div class="hover-little-thing">
    <div class="urls">
    <ul>
        <li><a href="/">Main page</a></li>
        <li><a href="/tallas2">Tallas2 Stream</a></li>
        <li><a href="/aurora">Aurora Stream</a></li>
        <li><a href="/apollo2">Apollo2 Stream</a></li>
    </ul>
    </div>
        <h1> Training Stream</h1> 
    </div>
    
    <div class="stats-container">
        <div class="mode" id="mode">Mode: Undefined</div>
        <div class="stats" id="epoch">Epoch: Undefined</div>
        <div class="stats" id="loss">Loss: NaN</div>
        <div class="stats" id="meanReward">Mean Reward: NaN</div>
    </div>

    <!-- Основной поток -->
    <img id="stream" alt="Video Stream" />

    <!-- Локальное видео для лучшего захода агента -->
    <video id="best-video" controls="" autoplay="" muted="" loop="" width="fit-content">
        <source src="static/gameplay/best_ppo_30_10.webm" type="video/mp4" codecs="mp4v">
        Ваш браузер не поддерживает элемент <code>video</code>.
        
    </video>


    <a href="http://talos2.ru:21936" class="logs-button">Logs</a>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var socket = io();  // Подключение к WebSocket
            
            socket.on('new_frame', function(data) {
                // Обновление основного потока
                var img = document.getElementById('stream');
                img.src = 'data:image/jpeg;base64,' + data.image;

                document.getElementById('epoch').innerText = 'Epoch: ' + data.epoch;
                document.getElementById('loss').innerText = 'Loss: ' + data.loss;
                document.getElementById('meanReward').innerText = 'Mean Reward: ' + data.meanReward;
                document.getElementById('mode').innerText = 'Mode: ' + data.mode;
            });

            socket.on('connect', function() {
                console.log('Connected to server');
            });

            socket.on('disconnect', function() {
                console.log('Disconnected from server');
            });

            socket.on('connect_error', function(error) {
                console.error('Connection Error:', error);
            });
        });
    </script>
</body>
</html>

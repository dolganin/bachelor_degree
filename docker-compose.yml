version: '3.8'

services:
  kafka:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "doom_screen:1:1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - mynetwork
    depends_on:
      - zookeeper
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --list --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 30
    command:
      - /bin/bash
      - -c
      - |
          /opt/kafka/bin/kafka-topics.sh --create --topic doom_screen --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
          /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/server.properties

  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"
    networks:
      - mynetwork
    restart: always

  kafka_consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: kafka_consumer:1.0
    environment:
      KAFKA_BROKER: kafka:9092
      MODE: ${MODE:-local}
    command: python /workspace/server_consumer/kafka_consumer.py
    networks:
      - mynetwork
    depends_on:
      - kafka
    restart: always

  flask_server:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask_server:1.0
    environment:
      KAFKA_BROKER: kafka:9092
      MODE: ${MODE:-local}
      ENV_PAGE: tallas2
    command: python /workspace/server_consumer/flask_server.py
    networks:
      - mynetwork
    depends_on:
      - kafka
    ports:
      - "5000:5000"

  tensorboard:
    image: tensorflow/tensorflow:latest
    command: tensorboard --logdir=/workspace/runs --host=0.0.0.0 --port=6006
    volumes:
      - /workspace/code/bachelor_degree/runs:/workspace/code/bachelor_degree/runs
    ports:
      - "6006:6006"
    networks:
      - mynetwork
    restart: always

volumes:
  kafka_data:

networks:
  mynetwork:
    driver: bridge

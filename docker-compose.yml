version: '3.8'

services:
  kafka:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    networks:
      - mynetwork
    restart: always

  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"
    networks:
      - mynetwork
    restart: always

  kafka-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: kafka_init:1.0
    command: ["/bin/bash", "-c", "/workspace/scripts/wait-for-it.sh kafka:9092 -- /workspace/scripts/create_kafka_topic.sh"]
    depends_on:
      - kafka
    networks:
      - mynetwork
    restart: "no"  # Этот сервис не перезапускается, он выполняется один раз

  kafka_consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: kafka_consumer:1.0
    environment:
      KAFKA_BROKER: kafka:9092
      MODE: ${MODE:-local}
    command: python /workspace/server_consumer/kafka_consumer.py
    networks:
      - mynetwork
    depends_on:
      - kafka-init  # Зависимость от kafka-init
    restart: always

  flask_server:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask_server:1.0
    environment:
      KAFKA_BROKER: kafka:9092
      MODE: ${MODE:-local}
    command: python /workspace/server_consumer/flask_server.py
    networks:
      - mynetwork
    depends_on:
      - kafka-init  # Зависимость от kafka-init
    ports:
      - "5000:5000"

  tensorboard:
    image: tensorflow/tensorflow:latest
    command: tensorboard --logdir=/workspace/runs --host=0.0.0.0 --port=6006
    volumes:
      - /workspace/code/bachelor_degree/runs:/workspace/code/bachelor_degree/runs
    ports:
      - "6006:6006"
    networks:
      - mynetwork
    restart: always

volumes:
  kafka_data:

networks:
  mynetwork:
    driver: bridge

version: '3.8'

services:
  kafka:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENER: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    networks:
      - mynetwork

  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"
    networks:
      - mynetwork

  kafka_dith:
    build:
      context: .
      dockerfile: Dockerfile
    image: kafka_dith:1.2
    environment:
      KAFKA_BROKER: kafka:9092
      MODE: ${MODE:-local}
    command: bash -c "
      python /workspace/server_consumer/kafka_consumer.py &
      wait"
    networks:
      - mynetwork
    depends_on:
      - kafka
      - zookeeper

  dith:
    build:
      context: .
      dockerfile: Dockerfile
    image: dith:1.2
    environment:
      KAFKA_BROKER: kafka:9092
      MODE: ${MODE:-local}
    command: bash -c "
      python /workspace/main.py > /workspace/main.log 2>&1 &
      tensorboard --logdir=/workspace/runs --port=6006 &
      wait"
    networks:
      - mynetwork
    depends_on:
      - kafka
      - zookeeper

networks:
  mynetwork:
    driver: bridge

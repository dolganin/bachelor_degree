version: '3'
services:
  kafka:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENER: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    networks:
      - mynetwork

  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"
    networks:
      - mynetwork

  consumer:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092  # Используем имя сервиса Kafka
    networks:
      - mynetwork
    depends_on:
      - kafka

  flask:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092  # Используем имя сервиса Kafka
    networks:
      - mynetwork
    depends_on:
      - kafka

networks:
  mynetwork:
    driver: bridge

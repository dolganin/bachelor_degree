version: '3.8'

services:
  kafka:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENER: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    networks:
      - mynetwork

  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"
    networks:
      - mynetwork

  kafka_dith:
    build:
      context: .
      dockerfile: Dockerfile
    image: kafka_dith:1.2
    environment:
      KAFKA_BROKER: kafka:9092
      MODE: ${MODE:-local}
    command: python /workspace/server_consumer/kafka_consumer.py
    networks:
      - mynetwork
    depends_on:
      - kafka
      - zookeeper

  dith:
    build:
      context: .
      dockerfile: Dockerfile
    image: dith:1.3
    environment:
      KAFKA_BROKER: 0.0.0.0:9092
      MODE: ${MODE:-local}
    command: python /workspace/main.py
    networks:
      - mynetwork
    depends_on:
      - kafka
      - zookeeper

  flask_server:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask_server:1.0
    environment:
      KAFKA_BROKER: kafka:9092
      MODE: ${MODE:-local}
    command: python /workspace/server_consumer/flask_server.py
    networks:
      - mynetwork
    depends_on:
      - kafka
      - zookeeper

  tensorboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: tensorboard:1.0
    command: tensorboard --logdir=/workspace/runs --port=6006
    ports:
      - "6006:6006"
    volumes:
      - dith_workspace:/workspace
    networks:
      - mynetwork
    depends_on:
      - dith

volumes:
  dith_workspace:

networks:
  mynetwork:
    driver: bridge
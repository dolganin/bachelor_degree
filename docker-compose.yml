version: '3.8'

services:
  kafka:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    networks:
      - mynetwork
    restart: always

  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"
    networks:
      - mynetwork
    restart: always

  kafka_dith:
    build:
      context: .
      dockerfile: Dockerfile
    image: kafka_dith:1.2
    environment:
      KAFKA_BROKER: kafka:9092
      MODE: ${MODE:-local}
    command: python /workspace/server_consumer/kafka_consumer.py
    networks:
      - mynetwork
    depends_on:
      - kafka
      - zookeeper
    restart: always

  dith:
    build:
      context: .
      dockerfile: Dockerfile
    image: dith:1.3
    runtime: nvidia
    environment:
      KAFKA_BROKER: kafka:9092
      MODE: ${MODE:-local}
      CUDA_VISIBLE_DEVICES: "0"
      SDL_VIDEODRIVER: dummy
      DISPLAY: ":99"
    command: tail -f /dev/null python /workspace/main.py
    networks:
      - mynetwork
    depends_on:
      - kafka
      - zookeeper
    restart: always

  flask_server:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask_server:1.0
    environment:
      KAFKA_BROKER: kafka:9092
      MODE: ${MODE:-local}
    command: python /workspace/server_consumer/flask_server.py
    networks:
      - mynetwork
    depends_on:
      - kafka
      - zookeeper
    ports:
      - "5000:5000"
    restart: always

  tensorboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: tensorboard:1.0
    command: tensorboard --logdir=/workspace/runs --port=6006
    ports:
      - "6006:6006"
    volumes:
      - dith_workspace:/workspace
    networks:
      - mynetwork
    depends_on:
      - dith
    restart: always

volumes:
  dith_workspace:

networks:
  mynetwork:
    driver: bridge

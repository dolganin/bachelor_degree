learning_parameters:
  learning_rate: 0.003
  discount_factor: 0.96
  train_epochs: 100
  replay_memory_size: 5000
  batch_size: 128
  test_episodes_per_epoch: 1000
  frame_repeat: 96
  learning_steps_per_epoch: 50
  weight_decay: 0.007
  lambda_intrinsic: 0.1
  entropy_coef: 0.1
  clip_epsiolon: 0.2
  hidden_dim: 512

env_parameters:
  resolution: [120, 130]
  episodes_to_watch: 10

meta_parameters:
  out_video_file: "server_consumer/static/gameplay/best_ppo_30_10.webm"
  save_model: True
  load_model: False
  skip_learning: False

doom_cfg_path: "scenarios/defend_the_line.cfg"


  
